monitor.alsa.rules = [
  {
    matches = [
      {
        # Matches your Logitech USB/Bluetooth Audio interface
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        # Keeps internal ALSA hardware mixer in exact lockstep with PipeWire
        "alsa.keep-hardware-volume" = true
        # Prevents software amplification from exceeding physical hardware limits
        "api.alsa.soft-mixer" = false
      }
    }
  }
]
